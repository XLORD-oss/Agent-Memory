name: CI

on:
  push:
    branches: [main, arena/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest
      - name: Token-cost model (offline)
        run: python -m benchmarks.token_cost.model
      - name: Context-rot harness (mock model)
        run: python -m benchmarks.context_rot.run --mock --turns 40 --facts 6
      - name: Sycophancy harness (mock model)
        run: python -m benchmarks.sycophancy.run_flipflop --mock --questions 5 --rounds 4
